zaptun.api.action.intercept = Sets a device up and starts capturing its traffic in ZAP: installs the zaptun app, injects ZAP's root CA, tunnels the device to ZAP and starts the VPN.
zaptun.api.action.intercept.param.apps = Package names to capture, comma separated. Leave empty to capture all apps.
zaptun.api.action.intercept.param.serial = The device's serial, as listed by the devices view. Optional when only one device is connected.
zaptun.api.action.setOptionAdbPath = Sets the adb binary to run.
zaptun.api.action.setOptionApps = Sets the apps to capture, comma separated.
zaptun.api.action.setOptionSdkPath = Sets the Android SDK folder to take adb from.
zaptun.api.action.stop = Stops capturing a device's traffic: turns lockdown and the VPN off and removes the adb reverse rule.
zaptun.api.action.stop.param.serial = The device's serial, as listed by the devices view. Optional when only one device is connected.
zaptun.api.action.useDetectedAdb = Clears the configured adb and SDK paths, so adb is detected from the environment again.
zaptun.api.desc = Captures all traffic of Android emulators and rooted devices in ZAP, over adb.
zaptun.api.view.adb = The adb binary zaptun runs: the configured one, or else the one detected from the environment.
zaptun.api.view.devices = Lists the adb devices, with their Android version, root method, and whether zaptun is installed and intercepting.
zaptun.api.view.optionAdbPath = The configured adb binary. Empty means adb is detected from the environment.
zaptun.api.view.optionApps = The apps last chosen for capture, comma separated.
zaptun.api.view.optionSdkPath = The configured Android SDK folder. Empty means it is detected from the environment.
zaptun.api.view.packages = Lists the third-party apps installed on a device.
zaptun.api.view.packages.param.serial = The device's serial, as listed by the devices view. Optional when only one device is connected.
zaptun.desc = Captures all traffic of an Android emulator or rooted device in ZAP: installs the zaptun VPN app, injects ZAP's root CA and starts the VPN over adb.
